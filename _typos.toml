[default]
extend-ignore-re = [
    '\\u\{[0-9A-Fa-f]+\}',
    # Keymap tests mark the caret and selections inside words, as in "baˇr"
    # and "hel«ˇlo»", and type parts of words.
    '\w*[ˇ«»]+\w*',
    'type_text\("[^"]*"\)',
    # A test that `crate_name` drops what isn't ASCII.
    '"café"\)\.unwrap\(\), "caf"',
]

[default.extend-identifiers]
PNGs = "PNGs"

[default.extend-words]
# Official Lucide icon name for the astroid curve.
astroid = "astroid"
# Vim's `bck_word` and `bckend_word`, which its word motions follow.
bck = "bck"
# Correct Italian singular of "command".
comando = "comando"
# A deliberately misspelled manifest key: `crates/shell/src/plugin.rs` refuses
# it by name, and the test that proves it has to contain the misspelling.
capabilites = "capabilites"
# Misspellings that only exist inside assertions proving a name is refused.
backgrund = "backgrund"
wtach = "wtach"
netwrok = "netwrok"
workspce = "workspce"
# PostgreSQL's BRIN index type, a keyword of the SQL grammar's highlight query.
brin = "brin"

[files]
extend-exclude = [
    "crates/story/src/fixtures/",
    # SCOWL's English word list, kept as published.
    "crates/writing/assets/",
    # tree-sitter-make's query, kept as published.
    "crates/component/src/highlighter/languages/make/highlights.scm",
]

# Spell-checking and suggestion tests misspell words on purpose and type the
# start of words.
[type.spelling-tests]
extend-glob = [
    "model.rs",
    "pacing.rs",
    "screenshots.rs",
    "spelling.rs",
    "suggestion_menu.rs",
    "suggestions.rs",
    "tests.rs",
    "textarea.rs",
    "timings.rs",
]

[type.spelling-tests.extend-words]
accomodate = "accomodate"
adress = "adress"
ba = "ba"
becuase = "becuase"
defin = "defin"
definately = "definately"
hel = "hel"
hte = "hte"
langauge = "langauge"
mial = "mial"
mississipi = "mississipi"
occured = "occured"
photograhpy = "photograhpy"
recieve = "recieve"
seperate = "seperate"
teh = "teh"
tha = "tha"
thsi = "thsi"
tommorow = "tommorow"
untill = "untill"
wether = "wether"
wierd = "wierd"
yuo = "yuo"

# The text editor story's dictionary lists common misspellings, and the
# writing story's document has some.
[type.text-editor-story]
extend-glob = ["text_editor_story.rs", "writing_story.rs"]

[type.text-editor-story.extend-words]
adress = "adress"
beleive = "beleive"
definately = "definately"
occured = "occured"
recieve = "recieve"
seperate = "seperate"
teh = "teh"
tommorow = "tommorow"
untill = "untill"
wich = "wich"
