[package]
name = "mhr-gpui-kit-assets"
description = "Default bundled assets for GPUI Kit."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
categories = ["gui"]
license = "Apache-2.0"
homepage = "https://github.com/mesa-hills-research/gpui_kit"
repository = "https://github.com/mesa-hills-research/gpui_kit"
readme = "README.md"
edition.workspace = true
publish = true
version = "0.7.8"

# Retain Cargo icon-directory metadata for existing build-script consumers.
links = "gpui-kit-default-icons"

[lib]
name = "gpui_kit_assets"

[features]
# Work Sans and JetBrains Mono, embedded as variable fonts: `gpui_kit::assets::fonts`.
fonts = []

[dependencies]
anyhow.workspace = true
gpui.workspace = true
log.workspace = true

[dev-dependencies]
gpui_platform.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
