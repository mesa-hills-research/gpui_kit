[package]
name = "mhr-gpui-kit-component-macros"
description = "Procedural macros for GPUI Component, the styled layer of GPUI Kit."
version = "0.7.5"
license = "Apache-2.0"
repository = "https://github.com/mesa-hills-research/gpui_kit"
keywords = ["gpui", "macros", "ui"]
categories = ["gui", "development-tools::procedural-macro-helpers"]
readme = "README.md"
publish = true
edition.workspace = true

[lib]
name = "gpui_component_macros"
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0"
proc-macro-crate = "3.5"
quote = "1.0"
syn = "2.0"

[package.metadata.cargo-machete]
ignored = ["proc-macro2", "core-text"]
