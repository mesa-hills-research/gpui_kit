[package]
name = "gpui-kit-writing-bench"
description = "Replays written text against GPUI Kit's word suggestions, keystroke by keystroke, and measures them."
license = "Apache-2.0"
edition.workspace = true
publish = false

[[bin]]
name = "writing-bench"
path = "src/main.rs"

[dependencies]
gpui-kit-writing = { workspace = true, features = ["replay"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
