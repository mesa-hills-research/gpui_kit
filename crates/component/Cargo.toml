[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
# Native menu (NativeMenu) — drives AppKit NSMenu via objc2.
raw-window-handle = { workspace = true }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSMenu",
    "NSMenuItem",
    "NSView",
    "NSWindow",
    "NSResponder",
    "NSEvent",
    "NSImage",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }
# Speech input (SystemRecognizer) — SFSpeechRecognizer via objc2.
block2 = { version = "0.6", optional = true }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVMediaFormat",
], optional = true }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVAudioBuffer",
    "AVAudioFormat",
    "AVAudioTypes",
], optional = true }
objc2-speech = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-avf-audio",
    "SFSpeechRecognitionMetadata",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFSpeechRecognizer",
    "SFTranscription",
], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Native menu (NativeMenu) — drives Win32 popup menus.
raw-window-handle = { workspace = true }
resvg = "0.45.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
criterion = "0.8"
gpui = { workspace = true, features = ["test-support", "bench-support"] }
gpui_platform = { workspace = true, features = ["bench-support"] }
indoc = "2"

[[bench]]
name = "code_block_stream"
harness = false
required-features = ["tree-sitter-rust", "tree-sitter-python"]

[[bench]]
name = "transcript_stream"
harness = false
required-features = ["tree-sitter-rust"]

[[bench]]
name = "long_paragraph"
harness = false

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["gpui_macros"]
