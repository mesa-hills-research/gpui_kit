[package]
description = "GPUI Component: the styled component library of GPUI Kit, with 60+ desktop UI components for GPUI."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
categories = ["gui"]
license = "Apache-2.0"
name = "mhr-gpui-kit-component"
homepage = "https://github.com/mesa-hills-research/gpui_kit"
repository = "https://github.com/mesa-hills-research/gpui_kit"
readme = "../../README.md"
version = "0.7.9"
publish = true
edition.workspace = true

[lib]
name = "gpui_component"
doctest = false

[features]
test-support = ["gpui/test-support", "gpui-base/test-support"]
decimal = ["gpui-base/decimal"]
inspector = ["gpui_macros/inspector", "gpui/inspector", "gpui-base/inspector"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-json"]
# Speech input: microphone capture and the system speech recognizer.
speech = [
    "dep:cpal",
    "dep:block2",
    "dep:objc2-speech",
    "dep:objc2-avf-audio",
    "dep:objc2-av-foundation",
    "objc2-foundation/NSBundle",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSError",
    "objc2-foundation/NSLocale",
    "windows/Foundation_Collections",
    "windows/Globalization",
    "windows/Media_SpeechRecognition",
]

# For syntax highlighting in Markdown and CodeEditor.
tree-sitter-languages = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-dart",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-elixir",
    "tree-sitter-elm",
    "tree-sitter-erb",
    "tree-sitter-erlang",
    "tree-sitter-fsharp",
    "tree-sitter-glsl",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-haskell",
    "tree-sitter-hcl",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-julia",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-objc",
    "tree-sitter-ocaml",
    "tree-sitter-perl",
    "tree-sitter-php",
    "tree-sitter-powershell",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-r",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-xml",
    "tree-sitter-yaml",
    "tree-sitter-zig",
]
tree-sitter-astro = ["tree-sitter", "dep:tree-sitter-astro-next"]
tree-sitter-bash = ["tree-sitter", "dep:tree-sitter-bash"]
tree-sitter-c = ["tree-sitter", "dep:tree-sitter-c"]
tree-sitter-cmake = ["tree-sitter", "dep:tree-sitter-cmake"]
tree-sitter-cpp = ["tree-sitter", "dep:tree-sitter-cpp"]
tree-sitter-csharp = ["tree-sitter", "dep:tree-sitter-c-sharp"]
tree-sitter-css = ["tree-sitter", "dep:tree-sitter-css"]
tree-sitter-dart = ["tree-sitter", "dep:tree-sitter-dart"]
tree-sitter-diff = ["tree-sitter", "dep:tree-sitter-diff"]
