tree-sitter-elixir = ["tree-sitter", "dep:tree-sitter-elixir"]
tree-sitter-elm = ["tree-sitter", "dep:tree-sitter-elm"]
tree-sitter-erb = ["tree-sitter", "dep:tree-sitter-embedded-template"]
tree-sitter-erlang = ["tree-sitter", "dep:tree-sitter-erlang"]
tree-sitter-fsharp = ["tree-sitter", "dep:tree-sitter-fsharp"]
tree-sitter-glsl = ["tree-sitter", "dep:tree-sitter-glsl"]
tree-sitter-go = ["tree-sitter", "dep:tree-sitter-go"]
