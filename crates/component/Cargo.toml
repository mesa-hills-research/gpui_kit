[dependencies]
regex = "1"
anyhow.workspace = true
gpui = { workspace = true }
gpui_macros.workspace = true
gpui-base.workspace = true
gpui-component-macros = { workspace = true }
gpui-kit-assets = { workspace = true }
notify.workspace = true
ropey.workspace = true
rust-i18n.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
smallvec.workspace = true
sum-tree.workspace = true
tracing.workspace = true
log.workspace = true
markdown = { version = "1.0.0", features = ["serde"] }

enum-iterator = "2.1.0"
itertools = "0.13.0"
once_cell = "1.19.0"
paste = "1"
uuid = "1.10"

# Chart
num-traits = "0.2"

# Calendar
chrono = "0.4.38"

# Code Editor
lsp-types.workspace = true

# Font picker: reads the families, weights and OpenType features of font files.
fontdb = { version = "0.23", default-features = false, features = ["std"] }
ttf-parser = "0.25"

# Cross-platform time APIs (zero-cost on native, uses web APIs on WASM)
instant.workspace = true

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true
# Font picker: finds the installed fonts.
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
cpal = { version = "0.15.3", optional = true }
# Tree-sitter and its grammars come from Mesquite, a pure Rust port published on
# crates.io, so no C compiler is needed. Its crates keep tree-sitter's library names
# (`tree_sitter`, `tree_sitter_rust`, ...), and the dependency names below keep the
# upstream crates' names. The grammars share the `mesquite_language` crate with
# `mesquite`, so keep them on releases that agree, and keep examples/editor/Cargo.toml
# and the Editor page (website/component/editor.md) on the same grammar release.
tree-sitter                   = { package = "mesquite", version = "0.25.10", optional = true }
tree-sitter-astro-next        = { package = "mesquite_astro", version = "0.1.0", optional = true }
tree-sitter-bash              = { package = "mesquite_bash", version = "0.1.0", optional = true }
tree-sitter-c                 = { package = "mesquite_c", version = "0.1.0", optional = true }
tree-sitter-c-sharp           = { package = "mesquite_c_sharp", version = "0.1.0", optional = true }
tree-sitter-cmake             = { package = "mesquite_cmake", version = "0.1.0", optional = true }
tree-sitter-cpp               = { package = "mesquite_cpp", version = "0.1.0", optional = true }
tree-sitter-css               = { package = "mesquite_css", version = "0.1.0", optional = true }
tree-sitter-dart              = { package = "mesquite_dart", version = "0.1.0", optional = true }
tree-sitter-diff              = { package = "mesquite_diff", version = "0.1.0", optional = true }
tree-sitter-elixir            = { package = "mesquite_elixir", version = "0.1.0", optional = true }
tree-sitter-elm               = { package = "mesquite_elm", version = "0.1.0", optional = true }
tree-sitter-embedded-template = { package = "mesquite_embedded_template", version = "0.1.0", optional = true }
tree-sitter-erlang            = { package = "mesquite_erlang", version = "0.1.0", optional = true }
tree-sitter-fsharp            = { package = "mesquite_fsharp", version = "0.1.0", optional = true }
tree-sitter-glsl              = { package = "mesquite_glsl", version = "0.1.0", optional = true }
tree-sitter-go                = { package = "mesquite_go", version = "0.1.0", optional = true }
tree-sitter-graphql           = { package = "mesquite_graphql", version = "0.1.0", optional = true }
tree-sitter-haskell           = { package = "mesquite_haskell", version = "0.1.0", optional = true }
tree-sitter-hcl               = { package = "mesquite_hcl", version = "0.1.0", optional = true }
tree-sitter-html              = { package = "mesquite_html", version = "0.1.0", optional = true }
tree-sitter-java              = { package = "mesquite_java", version = "0.1.0", optional = true }
tree-sitter-javascript        = { package = "mesquite_javascript", version = "0.1.0", optional = true }
tree-sitter-jsdoc             = { package = "mesquite_jsdoc", version = "0.1.0", optional = true }
tree-sitter-json              = { package = "mesquite_json", version = "0.1.0", optional = true }
tree-sitter-julia             = { package = "mesquite_julia", version = "0.1.0", optional = true }
tree-sitter-kotlin-ng         = { package = "mesquite_kotlin", version = "0.1.0", optional = true }
tree-sitter-lua               = { package = "mesquite_lua", version = "0.1.0", optional = true }
tree-sitter-make              = { package = "mesquite_make", version = "0.1.0", optional = true }
tree-sitter-md                = { package = "mesquite_markdown", version = "0.1.0", optional = true }
tree-sitter-objc              = { package = "mesquite_objc", version = "0.1.0", optional = true }
tree-sitter-ocaml             = { package = "mesquite_ocaml", version = "0.1.0", optional = true }
tree-sitter-perl              = { package = "mesquite_perl", version = "0.1.0", optional = true }
tree-sitter-php               = { package = "mesquite_php", version = "0.1.0", optional = true }
tree-sitter-powershell        = { package = "mesquite_powershell", version = "0.1.0", optional = true }
tree-sitter-proto             = { package = "mesquite_proto", version = "0.1.0", optional = true }
tree-sitter-python            = { package = "mesquite_python", version = "0.1.0", optional = true }
tree-sitter-r                 = { package = "mesquite_r", version = "0.1.0", optional = true }
tree-sitter-ruby              = { package = "mesquite_ruby", version = "0.1.0", optional = true }
tree-sitter-rust              = { package = "mesquite_rust", version = "0.1.0", optional = true }
tree-sitter-scala             = { package = "mesquite_scala", version = "0.1.0", optional = true }
tree-sitter-sequel            = { package = "mesquite_sql", version = "0.1.0", optional = true }
tree-sitter-svelte-ng         = { package = "mesquite_svelte", version = "0.1.0", optional = true }
tree-sitter-swift             = { package = "mesquite_swift", version = "0.1.0", optional = true }
tree-sitter-toml-ng           = { package = "mesquite_toml", version = "0.1.0", optional = true }
