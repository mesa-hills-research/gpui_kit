[package]
description = "GPUI Component: the styled component library of GPUI Kit, with 60+ desktop UI components for GPUI."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
name = "gpui-component"
documentation = "https://docs.rs/gpui-component"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "../../README.md"
version = "0.7.1"
publish = true
edition.workspace = true

[lib]
doctest = false

[features]
test-support = ["gpui/test-support", "gpui-base/test-support"]
decimal = ["gpui-base/decimal"]
inspector = ["gpui_macros/inspector", "gpui/inspector", "gpui-base/inspector"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-json"]
# Speech input: microphone capture and the system speech recognizer.
speech = [
    "dep:cpal",
    "dep:block2",
    "dep:objc2-speech",
    "dep:objc2-avf-audio",
    "dep:objc2-av-foundation",
    "objc2-foundation/NSBundle",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSError",
    "objc2-foundation/NSLocale",
    "windows/Foundation_Collections",
    "windows/Globalization",
    "windows/Media_SpeechRecognition",
]

# For syntax highlighting in Markdown and CodeEditor.
tree-sitter-languages = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-elixir",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
]
tree-sitter-astro = ["tree-sitter", "dep:tree-sitter-astro-next"]
tree-sitter-bash = ["tree-sitter", "dep:tree-sitter-bash"]
tree-sitter-c = ["tree-sitter", "dep:tree-sitter-c"]
tree-sitter-cmake = ["tree-sitter", "dep:tree-sitter-cmake"]
tree-sitter-cpp = ["tree-sitter", "dep:tree-sitter-cpp"]
tree-sitter-csharp = ["tree-sitter", "dep:tree-sitter-c-sharp"]
tree-sitter-css = ["tree-sitter", "dep:tree-sitter-css"]
tree-sitter-diff = ["tree-sitter", "dep:tree-sitter-diff"]
tree-sitter-ejs = ["tree-sitter", "dep:tree-sitter-embedded-template"]
tree-sitter-elixir = ["tree-sitter", "dep:tree-sitter-elixir"]
tree-sitter-erb = ["tree-sitter", "dep:tree-sitter-embedded-template"]
tree-sitter-go = ["tree-sitter", "dep:tree-sitter-go"]
tree-sitter-graphql = ["tree-sitter", "dep:tree-sitter-graphql"]
tree-sitter-html = ["tree-sitter", "dep:tree-sitter-html"]
tree-sitter-java = ["tree-sitter", "dep:tree-sitter-java"]
tree-sitter-javascript = ["tree-sitter", "dep:tree-sitter-javascript"]
tree-sitter-jsdoc = ["tree-sitter", "dep:tree-sitter-jsdoc"]
tree-sitter-kotlin = ["tree-sitter", "dep:tree-sitter-kotlin-ng"]
tree-sitter-lua = ["tree-sitter", "dep:tree-sitter-lua"]
tree-sitter-make = ["tree-sitter", "dep:tree-sitter-make"]
tree-sitter-markdown = ["tree-sitter", "dep:tree-sitter-md"]
tree-sitter-markdown-inline = ["tree-sitter-markdown"]
tree-sitter-php = ["tree-sitter", "dep:tree-sitter-php"]
tree-sitter-proto = ["tree-sitter", "dep:tree-sitter-proto"]
tree-sitter-python = ["tree-sitter", "dep:tree-sitter-python"]
tree-sitter-ruby = ["tree-sitter", "dep:tree-sitter-ruby"]
tree-sitter-rust = ["tree-sitter", "dep:tree-sitter-rust"]
tree-sitter-scala = ["tree-sitter", "dep:tree-sitter-scala"]
tree-sitter-sql = ["tree-sitter", "dep:tree-sitter-sequel"]
tree-sitter-svelte = ["tree-sitter", "dep:tree-sitter-svelte-ng"]
tree-sitter-swift = ["tree-sitter", "dep:tree-sitter-swift"]
tree-sitter-toml = ["tree-sitter", "dep:tree-sitter-toml-ng"]
tree-sitter-tsx = ["tree-sitter", "dep:tree-sitter-typescript"]
tree-sitter-typescript = ["tree-sitter", "dep:tree-sitter-typescript"]
tree-sitter-yaml = ["tree-sitter", "dep:tree-sitter-yaml"]
tree-sitter-zig = ["tree-sitter", "dep:tree-sitter-zig"]

[dependencies]
regex = "1"
anyhow.workspace = true
gpui = { workspace = true }
gpui_macros.workspace = true
gpui-base.workspace = true
gpui-component-macros = { workspace = true }
gpui-kit-assets = { workspace = true }
notify.workspace = true
ropey.workspace = true
rust-i18n.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
smallvec.workspace = true
sum-tree.workspace = true
tracing.workspace = true
log.workspace = true
markdown = { version = "1.0.0", features = ["serde"] }

enum-iterator = "2.1.0"
itertools = "0.13.0"
once_cell = "1.19.0"
paste = "1"
uuid = "1.10"

# Chart
num-traits = "0.2"

# Calendar
chrono = "0.4.38"

# Code Editor
lsp-types.workspace = true

# Font picker: reads the families, weights and OpenType features of font files.
fontdb = { version = "0.23", default-features = false, features = ["std"] }
ttf-parser = "0.25"

# Cross-platform time APIs (zero-cost on native, uses web APIs on WASM)
instant.workspace = true

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true
# Font picker: finds the installed fonts.
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
cpal = { version = "0.15.3", optional = true }
# Tree-sitter and its grammars come from Mesquite, a pure Rust port, so no C compiler
# is needed. Its crates keep tree-sitter's library names (`tree_sitter`,
# `tree_sitter_rust`, ...), and the dependency names below keep the upstream crates' names.
# Every entry names the same rev, as do examples/editor/Cargo.toml and the
# Editor page (website/component/editor.md): move them together.
tree-sitter                   = { package = "mesquite", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-astro-next        = { package = "mesquite_astro", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-bash              = { package = "mesquite_bash", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-c                 = { package = "mesquite_c", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-c-sharp           = { package = "mesquite_c_sharp", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-cmake             = { package = "mesquite_cmake", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-cpp               = { package = "mesquite_cpp", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-css               = { package = "mesquite_css", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-diff              = { package = "mesquite_diff", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-elixir            = { package = "mesquite_elixir", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-embedded-template = { package = "mesquite_embedded_template", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-go                = { package = "mesquite_go", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-graphql           = { package = "mesquite_graphql", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-html              = { package = "mesquite_html", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-java              = { package = "mesquite_java", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-javascript        = { package = "mesquite_javascript", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-jsdoc             = { package = "mesquite_jsdoc", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-json              = { package = "mesquite_json", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-kotlin-ng         = { package = "mesquite_kotlin", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-lua               = { package = "mesquite_lua", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-make              = { package = "mesquite_make", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-md                = { package = "mesquite_markdown", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-php               = { package = "mesquite_php", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-proto             = { package = "mesquite_proto", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-python            = { package = "mesquite_python", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-ruby              = { package = "mesquite_ruby", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-rust              = { package = "mesquite_rust", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-scala             = { package = "mesquite_scala", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-sequel            = { package = "mesquite_sql", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-svelte-ng         = { package = "mesquite_svelte", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-swift             = { package = "mesquite_swift", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-toml-ng           = { package = "mesquite_toml", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
tree-sitter-typescript        = { package = "mesquite_typescript", git = "https://github.com/mesa-hills-research/mesquite", rev = "fef5b10845abe8fb435b2c4192aec3920d3f1898", optional = true }
