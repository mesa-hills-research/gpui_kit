[package]
name = "gpui-kit"
version = "0.7.1"
description = "GPUI Kit: one dependency for building desktop applications with GPUI, GPUI Base, GPUI Component and default assets."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
categories = ["gui"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-kit"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "README.md"
publish = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["component", "assets"]
# The styled component library, `gpui_kit::component`. Initializes `gpui-base` too.
component = ["dep:gpui-component"]
# The default icon set for `gpui-component`, `gpui_kit::assets`.
assets = ["dep:gpui-kit-assets"]
# Work Sans and JetBrains Mono as variable fonts, `gpui_kit::assets::fonts`.
fonts = ["assets", "gpui-kit-assets/fonts"]
# GPUI's test harness, native-platform rendering, and Kit UI test helpers.
test-support = ["gpui/test-support", "gpui_platform/test-support", "gpui-base/test-support", "gpui-component?/test-support", "gpui-kit-writing?/test-support"]
# Frame-event instrumentation remains opt-in for performance builds.
profiler = ["gpui/profiler"]
inspector = ["gpui/inspector", "gpui-base/inspector", "gpui-component?/inspector"]
decimal = ["component", "gpui-component/decimal"]
# Spell checking and learned word suggestions for textareas, `gpui_kit::writing`.
writing = ["dep:gpui-kit-writing"]
# Speech input: microphone capture and the system speech recognizer.
speech = ["component", "gpui-component/speech"]
tree-sitter = ["component", "gpui-component/tree-sitter"]
tree-sitter-languages = ["component", "gpui-component/tree-sitter-languages"]
tree-sitter-astro = ["component", "gpui-component/tree-sitter-astro"]
tree-sitter-bash = ["component", "gpui-component/tree-sitter-bash"]
tree-sitter-c = ["component", "gpui-component/tree-sitter-c"]
tree-sitter-cmake = ["component", "gpui-component/tree-sitter-cmake"]
tree-sitter-cpp = ["component", "gpui-component/tree-sitter-cpp"]
tree-sitter-csharp = ["component", "gpui-component/tree-sitter-csharp"]
tree-sitter-css = ["component", "gpui-component/tree-sitter-css"]
tree-sitter-dart = ["component", "gpui-component/tree-sitter-dart"]
tree-sitter-diff = ["component", "gpui-component/tree-sitter-diff"]
tree-sitter-ejs = ["component", "gpui-component/tree-sitter-ejs"]
tree-sitter-elixir = ["component", "gpui-component/tree-sitter-elixir"]
tree-sitter-elm = ["component", "gpui-component/tree-sitter-elm"]
tree-sitter-erb = ["component", "gpui-component/tree-sitter-erb"]
tree-sitter-erlang = ["component", "gpui-component/tree-sitter-erlang"]
tree-sitter-fsharp = ["component", "gpui-component/tree-sitter-fsharp"]
tree-sitter-glsl = ["component", "gpui-component/tree-sitter-glsl"]
tree-sitter-go = ["component", "gpui-component/tree-sitter-go"]
tree-sitter-graphql = ["component", "gpui-component/tree-sitter-graphql"]
tree-sitter-haskell = ["component", "gpui-component/tree-sitter-haskell"]
tree-sitter-hcl = ["component", "gpui-component/tree-sitter-hcl"]
tree-sitter-html = ["component", "gpui-component/tree-sitter-html"]
tree-sitter-java = ["component", "gpui-component/tree-sitter-java"]
tree-sitter-javascript = ["component", "gpui-component/tree-sitter-javascript"]
tree-sitter-jsdoc = ["component", "gpui-component/tree-sitter-jsdoc"]
tree-sitter-julia = ["component", "gpui-component/tree-sitter-julia"]
tree-sitter-kotlin = ["component", "gpui-component/tree-sitter-kotlin"]
tree-sitter-lua = ["component", "gpui-component/tree-sitter-lua"]
tree-sitter-make = ["component", "gpui-component/tree-sitter-make"]
tree-sitter-markdown = ["component", "gpui-component/tree-sitter-markdown"]
tree-sitter-markdown-inline = ["component", "gpui-component/tree-sitter-markdown-inline"]
tree-sitter-objc = ["component", "gpui-component/tree-sitter-objc"]
tree-sitter-ocaml = ["component", "gpui-component/tree-sitter-ocaml"]
tree-sitter-perl = ["component", "gpui-component/tree-sitter-perl"]
tree-sitter-php = ["component", "gpui-component/tree-sitter-php"]
tree-sitter-powershell = ["component", "gpui-component/tree-sitter-powershell"]
tree-sitter-proto = ["component", "gpui-component/tree-sitter-proto"]
tree-sitter-python = ["component", "gpui-component/tree-sitter-python"]
tree-sitter-r = ["component", "gpui-component/tree-sitter-r"]
tree-sitter-ruby = ["component", "gpui-component/tree-sitter-ruby"]
tree-sitter-rust = ["component", "gpui-component/tree-sitter-rust"]
tree-sitter-scala = ["component", "gpui-component/tree-sitter-scala"]
tree-sitter-sql = ["component", "gpui-component/tree-sitter-sql"]
tree-sitter-svelte = ["component", "gpui-component/tree-sitter-svelte"]
tree-sitter-swift = ["component", "gpui-component/tree-sitter-swift"]
tree-sitter-toml = ["component", "gpui-component/tree-sitter-toml"]
tree-sitter-tsx = ["component", "gpui-component/tree-sitter-tsx"]
tree-sitter-typescript = ["component", "gpui-component/tree-sitter-typescript"]
tree-sitter-xml = ["component", "gpui-component/tree-sitter-xml"]
tree-sitter-yaml = ["component", "gpui-component/tree-sitter-yaml"]
tree-sitter-zig = ["component", "gpui-component/tree-sitter-zig"]

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui-component = { workspace = true, optional = true }
gpui-kit-assets = { workspace = true, optional = true }
gpui-kit-writing = { workspace = true, optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true

[dev-dependencies]
chrono = "0.4.38"
gpui = { workspace = true, features = ["test-support"] }
# The bundled fonts, for the golden that checks their weights render.
gpui-kit-assets = { workspace = true, features = ["fonts"] }
lsp-types.workspace = true
serde_json.workspace = true

# The golden-image harness for tests/screenshots.rs. It is not published, so it comes from the gpui
# repository at the commit the published mhr-gpui crates were cut from, and the workspace's
# [patch."https://github.com/mesa-hills-research/gpui"] gives it those published crates. Its goldens
# are drawn by Mesa's software Vulkan driver, on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-screenshot = { package = "mhr-gpui-screenshot", git = "https://github.com/mesa-hills-research/gpui", rev = "06a662731975699f33c19e30b3e96d2a9b6a2cf9" }
# The Rust grammar, so the diff view's goldens color their Rust the same way whether the build
# enables only the kit's default features or every grammar, as a workspace build with the story
# crate does.
gpui-component = { workspace = true, features = ["tree-sitter-rust"] }

[[test]]
name = "window"
required-features = ["test-support"]

[[test]]
name = "lifecycle"
required-features = ["test-support"]

[[test]]
name = "components"
required-features = ["test-support", "component"]

[[test]]
name = "input"
required-features = ["test-support", "component"]

[[test]]
name = "input_focus"
required-features = ["test-support", "component"]

[[test]]
name = "ui"
required-features = ["test-support", "component"]

[[test]]
name = "root"
required-features = ["test-support", "component"]

[[test]]
name = "controls"
required-features = ["test-support", "component"]

[[test]]
name = "interactions"
required-features = ["test-support"]

[[test]]
name = "font_picker"
required-features = ["test-support", "component"]

[[test]]
name = "screenshots"
required-features = ["test-support", "component", "assets"]

[[test]]
name = "rendering"
# Requires a real Metal device; select explicitly with --test rendering.
test = false
harness = false
required-features = ["test-support", "component", "assets"]

[[test]]
name = "disclosure"
required-features = ["test-support", "component"]

[[test]]
name = "overlays"
required-features = ["test-support", "component"]

[[test]]
name = "menu"
required-features = ["test-support", "component"]

[[test]]
name = "collections"
required-features = ["test-support", "component"]

[[test]]
name = "date_picker"
required-features = ["test-support", "component"]

[[test]]
name = "dock"
required-features = ["test-support", "component"]

[[test]]
name = "search"
required-features = ["assets", "test-support", "component"]

[[test]]
name = "touch_selection"
required-features = ["test-support", "component"]

[[test]]
name = "spinner_motion"
required-features = ["test-support", "component", "assets"]
