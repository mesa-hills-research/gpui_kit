# Haunt: Halloween night. Pumpkin orange on violet-black, with witch violet, poison green,
# candy corn and blood red in the code.

family = "Haunt"
file = "haunt.json"

[options]
shadow = true
primary_text = "dark"

[[themes]]
name = "Haunt"
mode = "dark"
