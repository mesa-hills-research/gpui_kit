# Kiln: a warm, quiet workspace. Warm charcoal or ivory, ivory or near-black text, and fired
# clay for the accent, with muted sage, slate, ochre and rose in the code.

family = "Kiln"
file = "kiln.json"

[options]
shadow = true
primary_text = "light"

[[themes]]
name = "Kiln Light"
mode = "light"
background = "oklch(0.982 0.006 95)"
