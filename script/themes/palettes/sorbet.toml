# Sorbet: soft pastels. Raspberry, blueberry, mint, pistachio and peach on lavender cream, or on
# a gentle plum-grey after dark.

family = "Sorbet"
file = "sorbet.json"

[options]
shadow = true

[options.styles]
comment = { font_style = "italic" }

