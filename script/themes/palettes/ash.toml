# Ash: a dim dark theme for people who find most dark themes too dark. Mid grey surfaces, soft
# light text and gentle pastels, with a calm blue accent.

family = "Ash"
file = "ash.json"

[options]
shadow = false
primary_text = "dark"

[[themes]]
name = "Ash"
mode = "dark"
background = "oklch(0.32 0.006 250)"
sidebar = "oklch(0.295 0.006 250)"
title_bar = "oklch(0.30 0.006 250)"
tab_bar = "oklch(0.29 0.006 250)"
popover = "oklch(0.36 0.007 250)"
control = "oklch(0.40 0.007 250)"
foreground = "oklch(0.94 0.006 250)"
muted = "oklch(0.80 0.008 250)"
accent = "oklch(0.80 0.09 245)"
on_fill_dark = "oklch(0.24 0.01 250)"

[themes.semantic]
red = "oklch(0.80 0.12 22)"
orange = "oklch(0.84 0.10 60)"
yellow = "oklch(0.90 0.10 92)"
green = "oklch(0.86 0.10 150)"
cyan = "oklch(0.86 0.07 205)"
blue = "oklch(0.82 0.08 250)"
magenta = "oklch(0.84 0.08 325)"

[themes.syntax]
keyword = "oklch(0.84 0.09 300)"
function = "oklch(0.87 0.08 230)"
type = "oklch(0.87 0.08 180)"
string = "oklch(0.88 0.09 130)"
number = "oklch(0.86 0.09 65)"
comment = "oklch(0.76 0.01 250)"
property = "oklch(0.91 0.03 240)"
attribute = "oklch(0.85 0.08 330)"
escape = "oklch(0.86 0.09 65)"
special = "oklch(0.85 0.08 330)"
punctuation = "oklch(0.80 0.01 250)"
