# Beacon: high contrast. Black and white with a signal-yellow (dark) or cobalt (light) accent,
# strong borders, bold keywords, and body text held to 7:1.

family = "Beacon"
file = "beacon.json"

[levels]
text = 7.0
subtle = 4.5
ui = 4.5
control = 3.0
highlight = 1.4
divider = 1.6
hover = 1.15

[options]
shadow = false

[options.styles]
keyword = { font_weight = 700 }

[[themes]]
name = "Beacon Light"
mode = "light"
background = "#FFFFFF"
sidebar = "oklch(0.965 0 0)"
title_bar = "oklch(0.975 0 0)"
tab_bar = "oklch(0.95 0 0)"
popover = "#FFFFFF"
foreground = "#000000"
muted = "oklch(0.38 0 0)"
accent = "oklch(0.45 0.22 265)"
border = "oklch(0.55 0 0)"
input_border = "oklch(0.35 0 0)"
hover = "oklch(0.91 0 0)"
sidebar_active = "oklch(0.86 0.03 265)"

