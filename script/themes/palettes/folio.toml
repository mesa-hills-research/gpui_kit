# Folio: paper and ink for reading and writing. Blue-black ink on warm paper, red-ink strings
# and pencil-grey italic comments, or cream on ink-black at night.

family = "Folio"
file = "folio.json"

[options]
shadow = false

[options.styles]
comment = { font_style = "italic" }

[[themes]]
name = "Folio Light"
mode = "light"
background = "oklch(0.972 0.012 90)"
sidebar = "oklch(0.948 0.016 88)"
title_bar = "oklch(0.96 0.014 89)"
tab_bar = "oklch(0.94 0.017 88)"
popover = "oklch(0.985 0.008 90)"
foreground = "oklch(0.25 0.025 265)"
muted = "oklch(0.50 0.025 260)"
accent = "oklch(0.46 0.13 262)"

