# Onyx: true black for OLED screens. Unlit black surfaces split by dim lines, soft grey text
# that does not glare, and a mint accent.

family = "Onyx"
file = "onyx.json"

[options]
shadow = false
primary_text = "dark"

[[themes]]
name = "Onyx"
mode = "dark"
background = "#000000"
editor = "#000000"
sidebar = "#000000"
title_bar = "#000000"
status_bar = "#000000"
tab_bar = "#000000"
popover = "oklch(0.17 0 0)"
control = "oklch(0.21 0 0)"
foreground = "oklch(0.88 0 0)"
muted = "oklch(0.66 0 0)"
accent = "oklch(0.82 0.13 170)"
border = "oklch(0.27 0 0)"
hover = "oklch(0.18 0 0)"
list_hover = "oklch(0.15 0 0)"
sidebar_active = "oklch(0.21 0 0)"

[themes.semantic]
red = "oklch(0.70 0.17 22)"
orange = "oklch(0.78 0.13 55)"
yellow = "oklch(0.87 0.12 92)"
green = "oklch(0.82 0.13 165)"
cyan = "oklch(0.82 0.10 205)"
blue = "oklch(0.74 0.11 255)"
magenta = "oklch(0.76 0.12 330)"

[themes.syntax]
keyword = "oklch(0.76 0.12 290)"
function = "oklch(0.84 0.11 205)"
type = "oklch(0.84 0.12 165)"
string = "oklch(0.86 0.10 120)"
number = "oklch(0.80 0.11 60)"
comment = "oklch(0.58 0 0)"
property = "oklch(0.86 0.04 240)"
attribute = "oklch(0.78 0.10 330)"
escape = "oklch(0.80 0.11 60)"
special = "oklch(0.78 0.10 330)"
punctuation = "oklch(0.62 0 0)"
