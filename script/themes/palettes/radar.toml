# Radar: a phosphor screen in a dark room. Two dark themes, green and amber, built from shades
# of one glowing hue, with a warm red kept for errors.

family = "Radar"
file = "radar.json"

[options]
shadow = false
primary_text = "dark"

[options.styles]
keyword = { font_weight = 700 }

[[themes]]
name = "Radar Green"
mode = "dark"
background = "oklch(0.16 0.025 155)"
